name: LIVE PATH CYCLE (paper slot + live slots)

# Item 58b step 2. The same architecture as PT-WRITER and FLEET CYCLE, and for the same
# reason: a cycle needs the broker credentials, network access AND the bound Index record at
# once, and only the Render service holds all three. So this job is a scheduler plus a
# messenger -- no checkout of data, no pip install, no push permission, and NO BROKER KEY ON
# GITHUB. The keys live on Render only.
#
# IT SHIPS AS A DRY RUN. There is no `?run=1` anywhere in this file, so installing it CANNOT
# place an order -- it computes each slot's plan, runs every preflight check, diffs each live
# slot against the paper slot, alerts on anything broken, and transmits nothing. That is
# deliberate: Don installs this BEFORE the auditor review, and a workflow that arrived already
# sending would make installing it the decision to go live, which is the one decision §8
# reserves for him.
#
# TO MAKE IT SEND, after the auditor review: add `?run=1` to the curl URL below. Nothing else
# changes. Even then every live slot is gated by four independent conditions in
# `valuation/edge/live_slots.py` (LIVE_PILOT_ENABLED, a non-zero percentage, a named
# authorized holder, and a key pair), and every slot ships at 0%.
#
# The door is /admin/live-cycle. Its rules live in `valuation/edge/live_cycle.py`, not here:
#   * only three events act: a new rebalance on the bound record, a percentage change, and
#     re-sending an open event's unfilled remainder
#   * a slot's holdings are reconciled from its OWN FILLS before anything is planned, so a
#     restart never repeats an order and a part fill leaves only the shortfall
#   * any failed preflight means no orders for that slot plus an alert -- never a guess
#   * nothing reads a return: no loss stops, no drawdown rule, no drift rebalance (§8a)
#   * GET computes and returns; only POST?run=1 may transmit
#
# Secrets: SITE_BASE_URL and ADMIN_TOKEN -- both already exist; auto-scan, track-backup,
# track-row and fleet-cycle use the same two. DISCORD_WEBHOOK_URL optional, and the service
# holds it, not this job.

on:
  workflow_dispatch: {}
  schedule:
    # 14:40 UTC is 10:40am ET in summer and 9:40am ET in winter -- INSIDE the session in both,
    # which is what matters: a fractional order must be a `day` limit order (Alpaca permits no
    # other time_in_force for a fractional quantity), and a `day` order placed outside market
    # hours is not worked until the next session. This repo has already been bitten twice a
    # year by a fixed UTC cron drifting against the Eastern session, so no DST pair is needed
    # here -- both regimes land in the session.
    #
    # Also: after the open's ten widest minutes have settled (every order is a limit at the
    # mid), well before the close so an unfilled order has most of a session to work, and not
    # on the hour, where every other scheduled job in this repo clusters.
    - cron: "40 14 * * 1-5"

concurrency:
  group: live-cycle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Run the live-path cycle (DRY RUN - computes and sends nothing)
        env:
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${SITE_BASE_URL:-}" ] || [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "::error::SITE_BASE_URL or ADMIN_TOKEN is unset"; exit 1
          fi
          BODY=$(mktemp)
          # NO `?run=1`. See the header: this is the dry run, and adding that parameter is the
          # single edit that turns it into a sending cycle.
          CODE=$(curl -sS -o "$BODY" -w '%{http_code}' \
                   --max-time 280 \
                   -H "X-Admin-Token: ${ADMIN_TOKEN}" \
                   "${SITE_BASE_URL%/}/admin/live-cycle") || CODE="000"
          echo "HTTP ${CODE}"
          cat "$BODY"
          # 200 IS THE ONLY SUCCESS, AND A QUIET CYCLE IS A SUCCESS. Most days carry no event
          # at all -- no rebalance, no percentage change, no open remainder -- and alerting on
          # that would teach everyone to ignore this job.
          [ "$CODE" = "200" ] || { echo "::error::live-cycle returned ${CODE}"; exit 1; }
          # THE CAUSE IS READ FROM THE BODY RATHER THAN GUESSED -- item 46's lesson, and item
          # 50's: no substring match on a code, no second copy of a reason that lives in the
          # service. Alerts are deduped by the service (`live_notify`), so this job prints for
          # the run log and does not double-post.
          # THE CAUSE IS READ FROM THE BODY RATHER THAN GUESSED -- item 46's lesson, and
          # item 50's: no substring match on a code, no second copy of a reason that lives in
          # the service. Alerts are deduped by the service (`live_notify`), so this job prints
          # for the run log and does not double-post.
          #
          # ONE-LINERS, NOT A HEREDOC. The first cut of this file indented a heredoc body and
          # its terminator; a terminator must sit at column 0 and indented Python is an
          # IndentationError, so it would have gone red on every run AFTER the cycle had
          # already succeeded. `|| true` on each: a summary that cannot be printed must not
          # fail a job whose real work is already done and reported by HTTP status.
          python -c 'import json,sys;d=json.load(open(sys.argv[1])) or {};p=d.get("paper") or {};print("paper slot: event=%s acted=%s orders=%d reason=%s" % (p.get("event"),p.get("acted"),len(p.get("orders") or []),(p.get("reason") or "")[:160]))' "$BODY" || echo "(the paper slot could not be summarised)"
          python -c 'import json,sys;d=json.load(open(sys.argv[1])) or {};s=d.get("slots") or [];print("\n".join("slot %s: pct=%s armed=%s orders=%d parity_ok=%s" % (x.get("slot"),x.get("pct"),x.get("armed"),len(x.get("orders") or []),(x.get("parity") or {}).get("ok")) for x in s) or ("no live slot configured: " + (d.get("reason") or "")[:200]))' "$BODY" || true
          python -c 'import json,sys;d=json.load(open(sys.argv[1])) or {};print("\n".join("::warning::slot %s %s: %s" % (a.get("slot"),a.get("kind"),(a.get("reason") or "")[:200]) for a in (d.get("alerts") or [])))' "$BODY" || true
