# Render Blueprint — one-click deploy of the SaaS app.
# In Render: New → Blueprint → point at your repo. It reads this file.
# Fill the "sync: false" secrets in the Render dashboard after the first deploy.
services:
  - type: web
    name: valuation-tool
    runtime: docker
    plan: starter                     # $7/mo; use "free" to trial (spins down when idle)
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: data                      # persists the SQLite DBs + snapshots
      mountPath: /app/data
      sizeGB: 1
    envVars:
      # POSTURE (changed 2026-08-04). Valquo is PUBLIC AND FREE TO ANYONE, forever: no
      # billing, no signup, no customers, no support obligation. The sensitive half is held
      # back by the OWNER SPLIT rather than by locking the door.
      #
      # WHY THAT IS STILL LICENCE-CLEAN. No commercial activity means no "business use"
      # trigger under the individual ThetaData and Sharadar plans. The LIVE path runs on FMP
      # and Tradier; Sharadar and ThetaData are BACKTEST-ONLY and must never reach a public
      # surface. Derived statistics Don computed are his; raw vendor rows are not.
      #
      # PRIVATE_MODE is the total lockdown (owner-only, nothing served to anyone else). It is
      # kept, tested, and now defaults to FALSE in code. Set it "true" here to lock the
      # instance again in one dashboard edit — nothing is deleted and every tier, route and
      # Stripe path below stays intact, which is why the Stripe keys stay configured.
      - key: PRIVATE_MODE
        value: "false"
      # THE LIABILITY BOUNDARY on a public instance, and the one to leave alone. It keeps
      # performance claims (the sandbox paper track and its equity curve), actionable live
      # picks (the constructed Index book, live option alerts, the intraday feed, the
      # portfolio builder) and backtest/vendor internals (the Edge Lab) owner-only, while the
      # valuation tool, the ranking and the methodology stay open to everyone. The path list
      # is valuation/saas/surfaces.py, one entry per surface with its reason and its vendor.
      # OWNER_SPLIT=false publishes all of it — do not set that without reading the Terms.
      - key: OWNER_SPLIT
        value: "true"
      # PUBLIC_FULL_VIEW — ANONYMOUS == DEMO, TEMPORARILY. Don's decision, 2026-08-13:
      #   "/app must be 100% ungated - I know the risks - I've submitted applications with
      #    the non-master link; when I hear back we regate."
      # Applications went out carrying the plain /app URL rather than the master link, so
      # recruiters were landing on the public half. This lifts an anonymous visitor to the
      # DEMO tier — the same read-only full view the /work button already grants — and
      # nothing more. Track Record, Edge Lab, Index, Signals and Watchlist become readable
      # signed out.
      #
      # ==> THE REGATE IS TWO CHANGES, NOT ONE (corrected 2026-08-14, audit MA9). This block
      #     used to read "THE REGATE IS THIS ONE VALUE ... nothing else needs touching", and
      #     that was wrong in the direction that matters.
      #
      #     1. Set PUBLIC_FULL_VIEW to "false". OWNER_SPLIT stays "true" underneath and is
      #        still enforced.
      #     2. ROTATE DEMO_ACCESS_TOKEN in the same window.
      #
      #     Why (2) is not optional: until 2026-08-14 the token's VALUE was rendered into the
      #     HTML of /work, a page anonymous visitors can read. Every value that was ever live
      #     before that date must be treated as PUBLIC. After the regate the token is once
      #     again the only gate on /api/track, /api/index-track, /api/valquo-index (names AND
      #     weights), /api/options-alerts and /api/scream-track — so regating without rotating
      #     restores a posture whose sole lock is a key the product already handed out.
      #
      #     The publication is fixed (the button now POSTs to /preview and the server sets the
      #     session; the token reaches no response body), so a token rotated AFTER that deploy
      #     stays private. Rotating is still required once, to retire the published ones.
      #     Generate: python -c "import secrets;print(secrets.token_urlsafe(24))"
      #
      # DO NOT regate by flipping OWNER_SPLIT instead: that also makes may_act true for
      # everyone, opening /api/scan/run, /api/signals/run and both Edge Lab runners to
      # anonymous callers. This flag is read-only by construction and cannot do that.
      # What does NOT move under it: mutation endpoints, admin/account/billing surfaces,
      # raw Sharadar/ThetaData rows, and every disclaimer, vintage and paper-account label.
      - key: PUBLIC_FULL_VIEW
        value: "true"
      # The unlisted portfolio page Don puts on a résumé — static prose plus statistics
      # computed in-house, reading no store and calling no API. It kept its own flag through
      # the posture change: it survived private mode, and it is independent of the split
      # above. PORTFOLIO_PATH moves it to an unguessable URL with no code change (validated
      # in config.py — a bad value falls back to /work); PORTFOLIO_PAGE=false removes it.
      - key: PORTFOLIO_PAGE
        value: "true"
      - key: PORTFOLIO_PATH
        value: "/work"
      - key: SECRET_KEY
        generateValue: true           # Render generates a strong secret
      - key: DATABASE_URL
        value: sqlite:///data/app.db
      - key: PUBLIC_BASE_URL
        sync: false                   # set to https://your-render-url or custom domain
      - key: ADMIN_TOKEN
        generateValue: true           # used by the weekly cron below
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: TRADIER_TOKEN
        sync: false
      - key: TRADIER_ENV
        value: sandbox
      # Forward paper track (roadmap #12). SEPARATE credentials from TRADIER_TOKEN above,
      # which stays the live app's production feed. The paper broker refuses any endpoint
      # other than sandbox.tradier.com and will not fall back to the production token, so
      # these two are the only way the track can reach an account — and it is a paper one.
      # Leave them unset and the paper-track cron reports "configured: false" and no-ops.
      - key: TRADIER_PAPER_TOKEN
        sync: false
      - key: TRADIER_PAPER_ACCOUNT_ID
        sync: false
      # Where the scream-buy alerts, the hot digest and the paper-track recaps post. Optional:
      # everything that uses it degrades to "not posted" rather than failing. It must be set
      # HERE (not only as a GitHub Actions secret) because those posts are sent server-side.
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: THETADATA_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_PREMIUM
        sync: false
      - key: STRIPE_PRICE_PRO_ANNUAL
        sync: false
      - key: STRIPE_PRICE_PREMIUM_ANNUAL
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false

  # Daily auto-scan — runs at a fixed time every weekday with ZERO manual setup.
  # It calls the web app's token-protected endpoint, which runs the scan in-process
  # and refreshes the snapshot the whole site reads. The host + token are pulled
  # automatically from the web service (fromService), so nothing to type and the
  # token always matches. Change the day/time by editing the schedule below.
  - type: cron
    name: weekly-scan-trigger
    runtime: image
    image:
      url: curlimages/curl:latest
    schedule: "0 11 * * 1-5"            # every weekday 11:00 UTC (~6-7am ET), pre-market
    dockerCommand: >
      curl -fsS -X POST "https://$TARGET_HOST/admin/run-scan" -H "X-Admin-Token: $ADMIN_TOKEN"
    envVars:
      - key: TARGET_HOST
        fromService:
          type: web
          name: valuation-tool
          property: host             # auto-filled with your site's hostname
      - key: ADMIN_TOKEN
        fromService:
          type: web
          name: valuation-tool
          envVarKey: ADMIN_TOKEN      # same token Render generated for the web app

  # Intraday Signals watcher — refreshes every 15 min during US market hours so the
  # Premium Signals feed is "always running". Same auto-linked host + token.
  - type: cron
    name: intraday-signals
    runtime: image
    image:
      url: curlimages/curl:latest
    schedule: "*/15 13-20 * * 1-5"    # every 15 min, ~9:30am-4pm ET, weekdays
    dockerCommand: >
      curl -fsS -X POST "https://$TARGET_HOST/admin/run-intraday" -H "X-Admin-Token: $ADMIN_TOKEN"
    envVars:
      - key: TARGET_HOST
        fromService:
          type: web
          name: valuation-tool
          property: host
      - key: ADMIN_TOKEN
        fromService:
          type: web
          name: valuation-tool
          envVarKey: ADMIN_TOKEN

  # Forward paper track (roadmap #12) — submits new scream-buy alerts to the Tradier PAPER
  # sandbox, marks the open ones, closes the matured ones through record_outcome, and appends
  # the day's Valquo-Index-vs-SPY point. Runs INSIDE the web service because the alerts, the
  # paper order state and the index holdings all live on its persistent disk; a CI runner gets
  # an empty database every time. Once, after the close — the exit rules are daily-mark rules,
  # so intraday runs would add broker calls without adding information.
  - type: cron
    name: paper-track
    runtime: image
    image:
      url: curlimages/curl:latest
    # 21:45 UTC, NOT 20:45. A cron cannot express "4pm Eastern", and 20:45 UTC is 4:45pm ET
    # only under EDT — under EST it is 3:45pm ET, fifteen minutes BEFORE the close, so the
    # whole winter would have been marked and entered mid-session on intraday prices. 21:45
    # is 5:45pm ET in summer and 4:45pm ET in winter: after the close in BOTH regimes, which
    # a single Render cron needs since (unlike the Actions workflow) there is one entry here.
    # The endpoint's session guard backstops it either way.
    schedule: "45 21 * * 1-5"          # weekdays 21:45 UTC = 5:45pm EDT / 4:45pm EST
    dockerCommand: >
      curl -fsS -X POST "https://$TARGET_HOST/admin/run-paper-track" -H "X-Admin-Token: $ADMIN_TOKEN"
    envVars:
      - key: TARGET_HOST
        fromService:
          type: web
          name: valuation-tool
          property: host
      - key: ADMIN_TOKEN
        fromService:
          type: web
          name: valuation-tool
          envVarKey: ADMIN_TOKEN

  # Discord recap of the forward paper track — Mon-Thu the daily post, Friday the fuller
  # weekly one INSTEAD of it (the weekly is a superset; two posts a minute apart is noise).
  # 21:58 / 21:59 UTC is after the close in BOTH DST regimes, 13 minutes behind the paper-track
  # cron above, so it reports a finished cycle. The endpoint reads the tracked record and
  # recomputes nothing; it de-dupes per kind per day and no-ops without DISCORD_WEBHOOK_URL.
  - type: cron
    name: paper-recap-daily
    runtime: image
    image:
      url: curlimages/curl:latest
    schedule: "58 21 * * 1-4"          # Mon-Thu 21:58 UTC = 5:58pm EDT / 4:58pm EST
    dockerCommand: >
      curl -fsS -X POST "https://$TARGET_HOST/admin/post-recap"
      -H "X-Admin-Token: $ADMIN_TOKEN" -H "Content-Type: application/json"
      -d '{"kind": "daily"}'
    envVars:
      - key: TARGET_HOST
        fromService:
          type: web
          name: valuation-tool
          property: host
      - key: ADMIN_TOKEN
        fromService:
          type: web
          name: valuation-tool
          envVarKey: ADMIN_TOKEN

  - type: cron
    name: paper-recap-weekly
    runtime: image
    image:
      url: curlimages/curl:latest
    schedule: "59 21 * * 5"            # Friday 21:59 UTC = 5:59pm EDT / 4:59pm EST
    dockerCommand: >
      curl -fsS -X POST "https://$TARGET_HOST/admin/post-recap"
      -H "X-Admin-Token: $ADMIN_TOKEN" -H "Content-Type: application/json"
      -d '{"kind": "weekly"}'
    envVars:
      - key: TARGET_HOST
        fromService:
          type: web
          name: valuation-tool
          property: host
      - key: ADMIN_TOKEN
        fromService:
          type: web
          name: valuation-tool
          envVarKey: ADMIN_TOKEN

# At scale, switch to Render Managed Postgres (set DATABASE_URL to its Internal URL,
# add psycopg2-binary, and port UserStore/screener Store to Postgres) so a real
# worker service can share the database. See SAAS_RUNBOOK.md.
