{% extends "_saas_base.html" %}
{% block title %}Set new password{% endblock %}
{% block body %}
<div class="wrap" style="padding:50px 22px;max-width:420px">
  <div class="card">
    <h2 style="margin-top:0;color:var(--navy)">Set a new password</h2>
    {% if invalid %}
      <div class="err">This reset link is invalid or has expired. <a href="/forgot">Request a new one</a>.</div>
    {% else %}
      {% if error %}<div class="err">{{ error }}</div>{% endif %}
      <form method="POST" action="/reset/{{ token }}"><input type="hidden" name="_csrf" value="{{ csrf_token }}">
        <label class="muted" style="font-size:13px">New password (min 8 characters)</label>
        <input type="password" name="password" required minlength="8" autofocus>
        <button class="btn" style="width:100%">Update password</button>
      </form>
    {% endif %}
  </div>
</div>
{% endblock %}
