# ============================================================================
#  Valquo — auto-land agent branches to main (hands-off merge + deploy)
#
#  WHAT IT DOES: when Claude Code pushes any `worktree-*` branch to GitHub,
#  this runs EVERY test suite in tests/ and — only if they all pass — merges that branch into
#  `main` and pushes it. Render auto-deploys `main`. No local merge, no Vim,
#  no git_push.bat, no you in the loop. If tests fail or the merge conflicts,
#  it stops and leaves `main` untouched (nothing broken ever ships).
#
#  ONE-TIME INSTALL (already done): repo Settings → Actions → General → Workflow
#  permissions must be "Read and write permissions" so the `land` job can push `main`.
# ============================================================================
#
#  MASTER AUDIT MA11 — 2026-08-15. THE JOB THAT RUNS BRANCH CODE NO LONGER HOLDS A WRITE TOKEN.
#
#  The audit's finding, verified against this file: the gate runs `python "$f"` for every
#  `tests/test_*.py` in the MERGED tree, so the branch supplies the code that judges it —
#  adding `tests/test_zz.py` was sufficient to execute arbitrary code, and the single job
#  held `contents: write` while doing it. `actions/checkout` also persists that token into
#  `.git/config`, so branch code could simply `git push --force origin main` and skip the
#  gate entirely.
#
#  Split into two jobs, because `permissions:` is per-job and this is the one control here
#  that GitHub actually enforces rather than merely encourages:
#    * `gate`  — permissions: contents: READ. Every line of branch code executes here. A
#                stolen token now buys read access to a repository the branch is already in.
#    * `land`  — permissions: contents: write. Merges and pushes, and runs NO branch code.
#
#  Plus `.github/land_policy.py`, READ FROM MAIN'S CHECKOUT BEFORE THE BRANCH IS MERGED, so a
#  branch cannot disable the policy by editing its own copy. It refuses two things: any change
#  under `.github/`, and the deletion of a test suite.
#
#  RESIDUAL, STATED RATHER THAN PAPERED OVER: for `push` events GitHub runs the workflow YAML
#  from the PUSHED branch, so a branch that rewrites THIS FILE to skip the policy escapes it.
#  Nothing in the repo can prevent that — the control is a GitHub-side ruleset protecting
#  `.github/**`, which is Don's to apply. This closes accidents and drift, not a determined
#  agent, and must never be described as if it did.
#
#  THE RETRY LOOP MOVED INTO `gate`, AND THE FIRST LIVE RUN IS WHY IT IS STILL THERE AT ALL.
#  The loop used to re-run the whole gate in-job when main moved under it — which under the
#  split would mean "run branch code again in the job holding the write token". The first cut
#  of MA11 therefore DELETED it and made `land` fail with "push again" instead. That was wrong,
#  and the very first run of the split proved it: main moved with code inside the ~5 minutes
#  the gate takes (7b5fc33 -> 90048ca) and the branch refused to land. With six lanes pushing,
#  a re-push has no better odds than the run it replaces, so "fail and ask" livelocks.
#
#  So the loop is back, in `gate`, where the token is read-only: merge, police, install, test,
#  then re-check main and go round again if CODE landed underneath. `land` keeps only the
#  narrow residual — it pushes when main is still at the gated base or has moved by
#  DOCUMENTATION alone, and fails otherwise. That window is now seconds rather than minutes,
#  and nothing can push a combination no gate has tested.
# ============================================================================
name: Land agent branch to main
on:
  push:
    branches: ['worktree-*']

# CONCURRENCY — 2026-08-07. This used to be a single repo-wide group, `land-main`,
# "to serialize so two pushes can't race main". It did serialize, and it also SILENTLY
# DROPPED BRANCHES, which is worse than the race it prevented.
#
# GitHub allows only ONE pending run per concurrency group: queue a third run while one
# is running and one is pending, and the PENDING one is cancelled outright. With every
# `worktree-*` push sharing one group and five or six lanes pushing, a branch that lost
# the pending slot never ran at all -- no failure, no red X, nothing to notice. Measured
# case: worktree-r1 @3fb0809 pushed 21:46 UTC never landed while three other branches
# landed at 22:59, 23:13 and 23:18; an empty re-trigger push at 00:20 landed in under a
# minute. That is a dropped run, not a conflict and not an outage.
#
# Now scoped per branch, so one lane's push can never cancel another lane's queued run.
# Within a branch, a newer push still supersedes an older queued one -- correct, since
# the newer commit contains the older. The main-races-main problem the old group was
# solving is now handled where it belongs, in the land job's re-merge loop.
concurrency:
  group: land-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # GATE — this is where untrusted branch code runs. Read-only token, by design.
  # ---------------------------------------------------------------------------
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read            # MA11: branch code executes in this job. It may not write.
    outputs:
      base: ${{ steps.gate.outputs.base }}
    steps:
      - name: Checkout main (full history)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Read the policy off MAIN, before the branch is merged into this tree. From here on
      # the working tree contains branch content, so anything read out of it is untrusted.
      - name: Save main's copy of the land policy
        run: |
          mkdir -p "$RUNNER_TEMP/policy"
          if [ -f .github/land_policy.py ]; then
            cp .github/land_policy.py "$RUNNER_TEMP/policy/land_policy.py"
            echo "Policy: using main's copy of .github/land_policy.py"
          else
            echo "::notice::main has no .github/land_policy.py yet — MA11 bootstrap run, policy not enforced. Every later push is checked against main's copy."
          fi

      # AUDIT C7 — the gate used to run tests/test_edge.py ONLY. Fourteen other suites did not
      # gate a deploy, while agent branches routinely edit options_universe.py, paper_track.py,
      # factors.py and screen.py, which that suite does not cover. Every suite runs now; the
      # loop keeps going so one red suite does not hide the others, and the job fails if any
      # failed. Longer CI is cheaper than an auto-merged regression reaching production.
      #
      # MA12 — dependencies install from the hash-pinned lock, not from `>=` ranges resolved
      # fresh on every run. It installs AFTER the merge so the tree under test gets the
      # dependencies that tree declares.
      - name: Gate — merge, police, install, test
        id: gate
        run: |
          git config user.name  "valquo-ci"
          git config user.email "ci@valquo.co"
          BR="${GITHUB_REF#refs/heads/}"
          SHA="${GITHUB_SHA}"

          git fetch origin "$BR"

          # Did anything that can affect a test result land between two commits? Markdown and
          # .gitattributes cannot change what `python tests/test_*.py` does, and this repo's
          # churn is overwhelmingly markdown handoffs. Anything else counts as code.
          # KEEP THIS BODY IDENTICAL TO THE COPY IN THE `land` JOB — a test asserts they match,
          # because the two jobs disagreeing about what "code" means is a silent way to push an
          # untested combination.
          code_changed() {
            [ -n "$(git diff --name-only "$1" "$2" -- . ':(exclude)*.md' ':(exclude).gitattributes')" ]
          }

          # THE RETRY LIVES HERE, IN THE READ-ONLY JOB, AND THAT IS THE POINT. `main` moves every
          # few minutes across six lanes while a full gate takes about five, so a branch that
          # simply gave up when main moved would livelock across pushes — measured on this very
          # change: the FIRST run of the split hit a code collision and refused. Retrying is
          # therefore not optional, but re-running the suites is running branch code, so it must
          # happen where the token cannot write.
          BASE=""
          for attempt in 1 2 3; do
            git fetch origin main
            BASE="$(git rev-parse origin/main)"

            echo "::group::Attempt $attempt — merging $BR ($SHA) into main ($BASE)"
            git checkout -B landing "$BASE"
            git merge --no-edit "$SHA" || {
              echo "::error::Merge conflict on $BR — main left untouched"
              git merge --abort || true
              exit 1
            }
            echo "::endgroup::"

            if [ -f "$RUNNER_TEMP/policy/land_policy.py" ]; then
              echo "::group::Land policy (main's copy)"
              python "$RUNNER_TEMP/policy/land_policy.py" --base "$BASE" --head "$SHA"
              echo "::endgroup::"
            fi

            echo "::group::Install dependencies (hash-pinned — MA12)"
            pip install --require-hashes -r requirements.lock.txt
            echo "::endgroup::"

            fail=0
            for f in tests/test_*.py; do
              echo "::group::$f"
              python "$f" || { echo "::error::$f FAILED"; fail=1; }
              echo "::endgroup::"
            done
            # `exit $fail` verbatim: tests/test_edge.py's C7 test asserts this exact string,
            # so that one red suite can never be hidden by a later green one. Keep the literal.
            if [ "$fail" -ne 0 ]; then exit $fail; fi

            git fetch origin main
            NOW="$(git rev-parse origin/main)"
            if [ "$NOW" = "$BASE" ] || ! code_changed "$BASE" "$NOW"; then
              echo "main is unchanged, or moved with documentation only, since this gate began."
              break
            fi
            echo "::warning::main moved with CODE during the gate ($BASE -> $NOW) — re-merging and re-running"
            BASE=""
          done

          if [ -z "$BASE" ]; then
            echo "::error::main moved with code on every attempt. Push $BR again to retry."
            exit 1
          fi

          # The exact main this tree was tested against. `land` pushes only if main is still
          # there, or has moved by documentation alone. Passing the sha rather than the branch
          # name also means `land` cannot pick up a newer, ungated commit if the lane pushes
          # again while this run is in flight.
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # LAND — holds the write token. Runs NO branch code: it merges and pushes only.
  # ---------------------------------------------------------------------------
  land:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write           # allow pushing to main
    steps:
      - name: Checkout main (full history)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Push the gated merge to main
        run: |
          git config user.name  "valquo-ci"
          git config user.email "ci@valquo.co"
          BR="${GITHUB_REF#refs/heads/}"
          SHA="${GITHUB_SHA}"
          BASE="${{ needs.gate.outputs.base }}"
          git fetch origin "$BR"

          # KEEP THIS BODY IDENTICAL TO THE COPY IN THE `gate` JOB — a test asserts they match.
          # If the two jobs disagreed about what counts as "code", `gate` could clear a tree
          # that `land` then pushes on top of a main it never saw.
          code_changed() {
            [ -n "$(git diff --name-only "$1" "$2" -- . ':(exclude)*.md' ':(exclude).gitattributes')" ]
          }

          for attempt in 1 2 3; do
            git fetch origin main
            NOW="$(git rev-parse origin/main)"

            if [ "$NOW" != "$BASE" ] && code_changed "$BASE" "$NOW"; then
              echo "::error::main moved with CODE changes since the gate passed ($BASE -> $NOW)."
              echo "::error::Refusing to push a combination no gate has tested. Push $BR again to re-run the gate."
              exit 1
            fi

            git checkout -B landing "$NOW"
            git merge --no-edit "$SHA" || {
              echo "::error::Merge conflict on $BR — main left untouched"
              git merge --abort || true
              exit 1
            }

            if git push origin HEAD:main; then
              echo "Landed $BR on main (attempt $attempt) — Render deploys from here."
              exit 0
            fi
            echo "::warning::Lost the push race on attempt $attempt — re-checking main"
          done

          echo "::error::Could not land $BR after 3 attempts; main moved every time. Push again to retry."
          exit 1
