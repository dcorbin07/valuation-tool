name: Auto scans (free-tier bridge)

# Runs the heavy scans on GitHub's runners (real RAM + internet) and pushes the
# finished results to the live site's token-protected ingest endpoints, so the
# free 512 MB web box just serves a ready snapshot. When you move to the paid
# Render blueprint, its own cron jobs do this — disable this workflow then.
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   SITE_BASE_URL      https://valuation-tool-h2hr.onrender.com
#   ADMIN_TOKEN        same value you set on Render
#   ANTHROPIC_API_KEY  (optional) enables AI notes on the top names
#   TRADIER_TOKEN      (optional) real-time Signals; else free/delayed data

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Which scan to run now
        type: choice
        options: [hot, intraday, both]
        default: hot
  schedule:
    # Hot list runs just AFTER the close so it uses complete end-of-day data and is ready before
    # the next open. Two attempts at ODD minutes because GitHub's free scheduler routinely DROPS
    # top-of-the-hour runs — a single :00 daily job is why the list silently went stale. The ingest
    # endpoint is idempotent per day, so the backup is a no-op if the primary already landed.
    - cron: "23 22 * * 1-5"         # hot list — 22:23 UTC (~5:23pm ET after close), primary
    - cron: "41 23 * * 1-5"         # hot list — 23:41 UTC backup, if GitHub dropped the primary
    - cron: "*/30 13-20 * * 1-5"    # intraday — every 30 min on free (fits Actions minutes);
                                    # the paid Render cron (render.yaml) runs this every 15 min
    - cron: "0 12 1 * *"            # self-learning — monthly (1st, 12:00 UTC), OOS-gated re-tune

concurrency:
  group: auto-scan-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  hot:
    if: ${{ (github.event_name == 'schedule' && (github.event.schedule == '23 22 * * 1-5' || github.event.schedule == '41 23 * * 1-5')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.kind == 'hot' || github.event.inputs.kind == 'both')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan the market and push the daily hot list
        env:
          BASE_URL: ${{ secrets.SITE_BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_USER_AGENT: "Donovan Corbin donniecorbin6@gmail.com"
          KIND: hot
          SCAN_SCOPE: whole_market
          SCAN_LIMIT: "1500"
          SCAN_DCF_TOP: "12"
        run: python scripts/ci_scan.py

  intraday:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '*/30 13-20 * * 1-5') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.kind == 'intraday' || github.event.inputs.kind == 'both')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan intraday signals and push the feed
        env:
          BASE_URL: ${{ secrets.SITE_BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          TRADIER_ENV: live
          KIND: intraday
          INTRADAY_LIMIT: "150"
          INTRADAY_AI_TOP: "10"
        run: python scripts/ci_scan.py

  learn:
    # Monthly self-learning: tells the site to re-tune its screener weights out-of-sample
    # (server-side; it has the accrued track record). Purely statistical. Just a trigger.
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 12 1 * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.kind == 'both') }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger monthly out-of-sample-gated re-tune
        env:
          BASE: ${{ secrets.SITE_BASE_URL }}
          TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          curl -fsS -X POST "$BASE/admin/run-learning" -H "X-Admin-Token: $TOKEN" || true
