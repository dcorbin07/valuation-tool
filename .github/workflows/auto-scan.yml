name: Auto scans (free-tier bridge)

# Runs the heavy scans on GitHub's runners (real RAM + internet) and pushes the
# finished results to the live site's token-protected ingest endpoints, so the
# free 512 MB web box just serves a ready snapshot. When you move to the paid
# Render blueprint, its own cron jobs do this — disable this workflow then.
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   SITE_BASE_URL      https://valuation-tool-h2hr.onrender.com
#   ADMIN_TOKEN        same value you set on Render
#   ANTHROPIC_API_KEY  (optional) enables AI notes on the top names
#   TRADIER_TOKEN      (optional) real-time Signals; else free/delayed data
#   FMP_API_KEY        (optional) fundamentals; the free stack covers the rest
#   DISCORD_WEBHOOK_URL (optional but RECOMMENDED) — where the watchdog and the scan-failure
#                      alert post. Without it a dead pipeline is only visible as a red run in
#                      the Actions tab, which is what let the July gap go unnoticed for 4 days.

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Which scan to run now
        type: choice
        options: [hot, intraday, both, watchdog, paper, recap-daily, recap-weekly]
        default: hot
      force:
        description: "paper only: run even if the session has not closed (skips the market-hours guard)"
        type: boolean
        default: false
  schedule:
    # Hot list runs just AFTER the close so it uses complete end-of-day data and is ready before
    # the next open. Two attempts at ODD minutes because GitHub's free scheduler routinely DROPS
    # top-of-the-hour runs — a single :00 daily job is why the list silently went stale. The ingest
    # endpoint is idempotent per day, so the backup is a no-op if the primary already landed.
    - cron: "23 22 * * 1-5"         # hot list — 22:23 UTC (~5:23pm ET after close), primary
    - cron: "41 23 * * 1-5"         # hot list — 23:41 UTC backup, if GitHub dropped the primary
    - cron: "*/23 13-20 * * 1-5"    # intraday — every 30 min on free (fits Actions minutes);
                                    # the paid Render cron (render.yaml) runs this every 15 min
    # Paper track. TWO crons because a crontab cannot say "4pm Eastern": 20:47 UTC is 4:47pm ET
    # under EDT but 3:47pm ET under EST — i.e. BEFORE the close for the whole winter, which
    # would have marked the book and entered positions mid-session on intraday prices with
    # nothing in the output looking wrong. Each cron is correct in one half of the year and
    # early in the other, and the endpoint's session guard (screener/market_session.py) turns
    # the early one into a no-op, so exactly one real run happens per day either way.
    # Once a day: the exit rules are daily-mark rules, so intraday runs would add broker
    # calls, not information. The cycle is idempotent (claim rows on the alerts, PK on the
    # day's index point), so overlapping with render.yaml's cron is harmless, not double.
    - cron: "47 20 * * 1-5"         # 20:47 UTC = 4:47pm ET in summer (EDT)
    - cron: "47 21 * * 1-5"         # 21:47 UTC = 4:47pm ET in winter (EST)
    # Discord recap of the paper track, ~11 minutes after the track itself so it reports a
    # finished cycle rather than the previous day's. Same two-cron DST trick and the same
    # session guard; the endpoint also de-dupes per kind per day, so the cron that fires on
    # the wrong side of the boundary is a no-op rather than a second post.
    #
    # Mon-Thu get the DAILY post and Friday gets the WEEKLY one INSTEAD of it — the weekly is
    # a superset, and firing both a minute apart would just train Don to skim past them.
    - cron: "58 20 * * 1-4"         # daily recap — 20:58 UTC = 4:58pm ET in summer (EDT)
    - cron: "58 21 * * 1-4"         # daily recap — 21:58 UTC = 4:58pm ET in winter (EST)
    - cron: "59 20 * * 5"           # weekly recap — Friday, after the close (EDT)
    - cron: "59 21 * * 5"           # weekly recap — Friday, after the close (EST)
    # REMOVED by the master audit (MA1): `- cron: "0 12 1 * *"` fired a monthly POST to
    # /admin/run-learning, whose adopted weights were then PREFERRED over settings.WEIGHTS_* by
    # the live scorer. That made a scheduled job a live scoring change with no commit, no diff
    # and no review, and the vintage contract could not see it. Next firing would have been
    # 2026-09-01. The `learn:` job below it is removed too; re-tuning is now a deliberate,
    # registered act — see valuation/edge/weight_adoption.py.
    - cron: "15 13 * * 1-5"         # watchdog — 13:15 UTC (~9:15am ET), BEFORE the open, so a
                                    # dead pipeline is known about while there is still a day
                                    # to fix it rather than after the next close

concurrency:
  group: auto-scan-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  hot:
    if: ${{ (github.event_name == 'schedule' && (github.event.schedule == '23 22 * * 1-5' || github.event.schedule == '41 23 * * 1-5')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.kind == 'hot' || github.event.inputs.kind == 'both')) }}
    runs-on: ubuntu-latest
    # 30 was sized for the 191-name bundled fallback. The real universe is ~800 names and
    # most of them are served by the free stack at ~1.8s each on a cold cache (much faster
    # once actions/cache has warmed the fundamentals), so it needs real headroom.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      # MA12 — hash-pinned. This job SCORES STOCKS on a schedule, so an unannounced vendor
      # library upgrade here reaches the published hot list with no human step anywhere.
      - run: pip install --require-hashes -r requirements.lock.txt
      # Persist the fundamentals cache between runs. FMP's subscription here has no bulk
      # endpoint, so every uncached name costs 3 requests and a 1,500-name universe on a
      # cold cache is ~4,500 — more than a day's quota. With the cache warm a run only pays
      # for entries that have aged past the 30-day TTL. restore-keys makes each run start
      # from the most recent cache even though the key is date-stamped.
      - name: Restore the scan cache
        uses: actions/cache@v4
        with:
          path: .scan-cache
          key: scan-cache-${{ github.run_id }}
          restore-keys: scan-cache-
      - name: Scan the market and push the daily hot list
        env:
          BASE_URL: ${{ secrets.SITE_BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Without this the CI scan silently falls back to the ~190-name bundled list AND
          # loses the universe's company names / sectors / market caps. Empty is harmless
          # (the free EDGAR+Yahoo path still runs), so this is safe before the secret exists.
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SEC_USER_AGENT: "Donovan Corbin donniecorbin6@gmail.com"
          # LA9 — WITHOUT THESE THE COMMENT BELOW WAS FALSE. `broker_universe.available()` and
          # `broker_fundamentals.available()` are both `bool(cfg.tradier_token)`, and this job
          # passed no token (the intraday job did). So every scheduled hot scan fell back to the
          # SEC EDGAR filer list — no price, no market cap, no size ordering — truncated to the
          # first SCAN_LIMIT names, and ran the whole universe on the rate-limited free stack.
          # The audit marked this a HYPOTHESIS because it could not read a run log. It is
          # confirmed from the workflow definition itself, which is the authority on what env a
          # job receives; a log would only have shown the symptom.
          #
          # TRADIER_ENV IS NOT OPTIONAL HERE AND PASSING THE TOKEN ALONE WOULD HAVE BEEN A
          # QUIETER VERSION OF THE SAME BUG: `CONFIG.tradier_env` defaults to "sandbox"
          # (config.py:53) and `broker_universe._base` sends sandbox traffic to
          # sandbox.tradier.com, so the job would have "had a broker" and still not had the
          # liquidity-ranked universe. `live` here selects the MARKET-DATA endpoint; the paper
          # broker deliberately reads different fields (config.py:55-56) and nothing on this
          # path can place an order.
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          TRADIER_ENV: live
          # THEME RESTORATION — put the share-issuance cache inside the directory this job
          # actually persists (the `actions/cache` step above caches `.scan-cache`, not
          # `data/`). Without it every scheduled scan refetches the whole universe from SEC to
          # learn share counts that change quarterly at most; with it a warm run pays for the
          # handful of names whose 30-day entry has aged out.
          ISSUANCE_CACHE_DIR: .scan-cache/issuance
          KIND: hot
          # whole_market now resolves to the broker's liquidity-ranked universe (~7,100
          # listed names, kept to the most liquid SCAN_LIMIT). 800 is the large-cap tier and
          # fits the job's wall clock on a cold cache; raise it once the cache is warm.
          SCAN_SCOPE: whole_market
          SCAN_LIMIT: "800"
          SCAN_DCF_TOP: "12"
        run: python scripts/ci_scan.py

  intraday:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '*/23 13-20 * * 1-5') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.kind == 'intraday' || github.event.inputs.kind == 'both')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock.txt   # MA12
      - name: Scan intraday signals and push the feed
        env:
          BASE_URL: ${{ secrets.SITE_BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          TRADIER_ENV: live
          KIND: intraday
          INTRADAY_LIMIT: "150"
          INTRADAY_AI_TOP: "10"
        run: python scripts/ci_scan.py

  watchdog:
    # Runs SEPARATELY from the scan on purpose: a check inside the scan job cannot fire when
    # the scan job is what died, which is exactly the July failure. This asks the public API
    # what a real visitor would receive, and goes red (plus pings Discord) if it is stale or
    # if the universe has collapsed.
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '15 13 * * 1-5') || (github.event_name == 'workflow_dispatch' && github.event.inputs.kind == 'watchdog') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check the live site is still being fed
        env:
          BASE_URL: ${{ secrets.SITE_BASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/check_staleness.py

  paper:
    # Forward paper track (roadmap #12) - the project's #1 remaining validation: a track on data
    # nobody had seen when the rules were fixed.
    #
    # This is a TRIGGER, not the work. The cycle runs inside the web service because the alerts,
    # the paper order state and the index holdings all live in its database on the persistent
    # disk. A GitHub runner gets an empty database every run: it would find no alerts, submit
    # nothing, and lose the state that makes the cycle idempotent - so the state would be gone
    # and the "never double-submit" guarantee with it.
    #
    # Needs TRADIER_PAPER_TOKEN + TRADIER_PAPER_ACCOUNT_ID set as RENDER env vars (not as Actions
    # secrets - the endpoint reads them server-side). Until they are set the endpoint answers
    # {"configured": false} and does nothing, which is why this is safe to schedule first.
    if: ${{ (github.event_name == 'schedule' && (github.event.schedule == '47 20 * * 1-5' || github.event.schedule == '47 21 * * 1-5')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.kind == 'paper') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run one day of the forward paper track
        env:
          BASE: ${{ secrets.SITE_BASE_URL }}
          TOKEN: ${{ secrets.ADMIN_TOKEN }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          BODY='{}'
          if [ "${FORCE:-false}" = "true" ]; then BODY='{"force": true}'; fi
          RESP=$(curl -fsS -X POST "$BASE/admin/run-paper-track" \
            -H "X-Admin-Token: $TOKEN" -H "Content-Type: application/json" -d "$BODY")
          echo "$RESP" | head -c 4000; echo
          # Say out loud which of the two crons this was. A skip is the EXPECTED outcome for
          # the one that fires on the wrong side of the DST boundary — but a skip every single
          # day would mean the guard never opens, and that must not read as a green run.
          case "$RESP" in
            *'"skipped": true'*|*'"skipped":true'*)
              echo "::notice::paper track skipped — session not closed (expected for the off-season cron)" ;;
            *'"configured": false'*|*'"configured":false'*)
              echo "::error::paper track is NOT configured — TRADIER_PAPER_TOKEN / TRADIER_PAPER_ACCOUNT_ID are missing on Render"
              exit 1 ;;
            *) echo "::notice::paper track ran" ;;
          esac

  recap:
    # Daily / weekly Discord recap of the forward paper track. A TRIGGER, like the paper job:
    # the book lives in the web service's database, so a runner reading its own empty copy
    # would post a beautifully formatted recap of nothing.
    #
    # Needs DISCORD_WEBHOOK_URL set as a RENDER env var (the endpoint posts server-side, so
    # the Actions secret of the same name — used by the scan and the watchdog — does NOT feed
    # this). Without it the endpoint answers posted:false with a reason and this job warns
    # rather than failing: a missing optional notification must not turn the pipeline red.
    if: ${{ (github.event_name == 'schedule' && (github.event.schedule == '58 20 * * 1-4' || github.event.schedule == '58 21 * * 1-4' || github.event.schedule == '59 20 * * 5' || github.event.schedule == '59 21 * * 5')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.kind == 'recap-daily' || github.event.inputs.kind == 'recap-weekly')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Post the paper-track recap to Discord
        env:
          BASE: ${{ secrets.SITE_BASE_URL }}
          TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_KIND: ${{ github.event.inputs.kind }}
        run: |
          set -euo pipefail
          # The Friday crons are the weekly ones; everything else is the daily.
          KIND=daily
          case "${SCHEDULE:-}" in *"* * 5") KIND=weekly ;; esac
          case "${DISPATCH_KIND:-}" in
            recap-weekly) KIND=weekly ;;
            recap-daily)  KIND=daily ;;
          esac
          echo "recap kind: $KIND"
          RESP=$(curl -fsS -X POST "$BASE/admin/post-recap" \
            -H "X-Admin-Token: $TOKEN" -H "Content-Type: application/json" \
            -d "{\"kind\": \"$KIND\"}")
          echo "$RESP" | head -c 2000; echo
          case "$RESP" in
            *'"posted": true'*|*'"posted":true'*)
              echo "::notice::$KIND recap posted" ;;
            *'"skipped": true'*|*'"skipped":true'*)
              echo "::notice::recap skipped — session not closed (expected for the off-season cron)" ;;
            *'"duplicate": true'*|*'"duplicate":true'*)
              echo "::notice::recap already posted today (the other DST cron got there first)" ;;
            *DISCORD_WEBHOOK_URL*)
              echo "::warning::recap built fine but DISCORD_WEBHOOK_URL is not set on Render — nothing was posted" ;;
            *) echo "::warning::recap did not post; see the response above" ;;
          esac

  # THE `learn:` JOB WAS REMOVED BY THE MASTER AUDIT (MA1).
  #
  # It ran, monthly and unattended:
  #     curl -fsS -X POST "$BASE/admin/run-learning" -H "X-Admin-Token: $TOKEN" || true
  # `/admin/run-learning` -> `autolearn.run_learning` -> `save_learned(..., adopted=True)` ->
  # `screen._effective_weights` PREFERRING that row over `settings.WEIGHTS_*`. Every link was
  # shipped and tested, so a cron could change the composite users receive by writing to
  # Render's own SQLite — no code commit, no diff, nothing for the vintage contract to see.
  # `|| true` meant it could not even fail loudly. Next firing: 2026-09-01.
  #
  # It is NOT re-added by turning LEARN_ENABLED back on. Re-tuning is now deliberate: the
  # endpoint still exists for a human with the token, `cfg.learn_enabled` defaults FALSE, and
  # `store.save_learned` refuses to write an adopted weight without a registered vintage plus
  # Don's signed contract row (valuation/edge/weight_adoption.py). Pinned by
  # tests/test_weight_adoption.py, which fails if a run-learning trigger reappears here.
