name: Track backup (the one thing that can't be re-derived)

# Commits a plain-text snapshot of the FORWARD PAPER TRACK into the repo every week.
#
# TWO DIFFERENT BOOKS ARE BACKED UP, and conflating them is the defect this workflow shipped
# with (audit LA2, fixed 2026-08-10):
#   * the CONTRACT-BOUND Valquo Index (`valquo_index_*`) — 86 names, score-weighted, 8% cap,
#     inception 2026-07-30. This is the series `PAPER_TRACK_CONTRACT.md` binds and the only one
#     that may ever be cited as evidence under it.
#   * the Tradier SANDBOX engine (`paper_track_*`) — 10 names against the Index's 86,
#     equal-weighted, inception 2026-08-03. It is not the Index.
# Until LA2 this job backed up the second and ZERO rows of the first, and its anti-regression
# guard counted the second — so the record it existed to protect was never counted at all.
#
# CORRECTED 2026-08-11 (cold audit LA11). The sandbox bullet used to add "Its weights break the
# contract's own 8% cap." They do not: `valquo_index.build_index` sets
# `cap = max(MAX_WEIGHT, 1/len(picks))` on purpose, because ten names at 8% sum to 80%. Session
# 16 (`PT-SPLIT`) retracted the cap reading; the books differ on SIZE, and the conclusion above
# is unchanged. Tell them apart by `n_positions`, never by the cap.
#
# Why this workflow has to exist at all: the live record lives in the SQLite database on the
# Render web service's persistent disk (render.yaml: disk `data`, /app/data, 1GB). That disk
# survives redeploys but not the service being deleted or recreated. Everything else in this
# project can be rebuilt from the vendor exports; the forward track cannot, because it is a
# record of what the model said on days that have already passed. Recreating it later from
# current data would produce a different object with the same column names.
#
# Render cannot commit to git and GitHub Actions cannot read Render's disk, so the backup
# crosses the gap over HTTP: the web service exposes the payload at /admin/export-track behind
# the same admin token the other crons use, and this job renders it into data_export/ and
# commits it. Committed means it is in git history AND on Don's machine after a `git pull`.
#
# Setup (repo -> Settings -> Secrets and variables -> Actions) — the SAME two secrets the
# auto-scan workflow already uses, so there is most likely nothing to add:
#   SITE_BASE_URL       https://valuation-tool-h2hr.onrender.com
#   ADMIN_TOKEN         the value Render generated for the web service
#   DISCORD_WEBHOOK_URL (optional) — where a FAILED backup is announced

on:
  workflow_dispatch: {}          # run it by hand any time, e.g. right before touching Render
  schedule:
    # Sunday 06:17 UTC. Weekly is enough — the track appends one index point per weekday and
    # a handful of trades, so a lost week is a small loss, while a daily commit would add ~250
    # no-op-ish commits a year to a repo Don reads by hand. An ODD minute because GitHub's
    # scheduler routinely drops top-of-the-hour runs (the same reason auto-scan.yml uses :23).
    - cron: "17 6 * * 0"

# Least privilege: this job writes files to the repo and nothing else.
permissions:
  contents: write

concurrency:
  # Never two backups racing to commit the same four files.
  group: track-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # ---- ITEM 74: HEALTHCHECKS, SO SILENCE IS DETECTABLE FROM OUTSIDE ------------------
      #
      # Nothing inside GitHub can report that GitHub stopped running jobs, and it has happened
      # once (August, a billing hiccup). healthchecks.io expects a ping on this schedule and
      # tells Don when one does not arrive. Absent key = a warning and carry on; a monitor is
      # not allowed to stop the job it monitors.
      - name: "item 74: healthchecks start (track-backup)"
        if: always()
        env:
          HC_PING_KEY: ${{ secrets.HC_PING_KEY }}
        run: |
          set -u
          if [ -z "${HC_PING_KEY:-}" ]; then
            echo "::warning::HC_PING_KEY is not set -- no outside monitor is watching track-backup"
            exit 0
          fi
          curl -sS -m 10 --retry 2 "https://hc-ping.com/${HC_PING_KEY}/track-backup/start" \
            >/dev/null || true
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Pull the forward track from the live service
        env:
          BASE: ${{ secrets.SITE_BASE_URL }}
          TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ -z "${TOKEN:-}" ]; then
            echo "::error::SITE_BASE_URL and ADMIN_TOKEN must both be set as Actions secrets."
            exit 1
          fi
          # -f so an HTTP error is a failed step rather than a committed error page. That
          # matters more here than anywhere else in the repo: silently committing {"error":
          # "unauthorized"} over a good backup would destroy the thing being backed up.
          curl -fsS "$BASE/admin/export-track" -H "X-Admin-Token: $TOKEN" -o payload.json
          python - <<'PY'
          import json, sys
          d = json.load(open("payload.json"))
          if not d.get("ok"):
              print("::error::export endpoint returned an error:", d.get("error"))
              sys.exit(1)
          c = (d.get("export") or {}).get("counts") or {}
          # Both books, named for what they are. `index_days` is the SANDBOX engine; the
          # contract-bound Valquo Index is `bound_index_days`, and it is absent entirely from
          # a service still running pre-LA2 code — which is why the render step below merges
          # the committed copy rather than trusting this number.
          print("sandbox engine days:", c.get("index_days"),
                "| closed trades:", c.get("option_alerts_closed"),
                "| BOUND Valquo Index days:", c.get("bound_index_days"),
                "| legacy ingested days:", c.get("ingested_index_days"))
          PY

      - name: Snapshot the committed backup, so the guard has something to compare against
        run: |
          set -euo pipefail
          # Taken BEFORE the render, because the render overwrites data_export/ in place.
          # Anything the committed tree does not have is legitimately absent -> 0 rows.
          mkdir -p .guard-committed
          for f in valquo_index_track.csv paper_track_index.csv; do
            git show "HEAD:data_export/$f" > ".guard-committed/$f" 2>/dev/null \
              || rm -f ".guard-committed/$f"
          done
          ls -l .guard-committed/ || true

      - name: Render the backup files, and refuse to lose a row of either book
        run: |
          set -euo pipefail
          # --guard-against fails the step when EITHER series comes back with fewer rows than
          # the committed copy. The render itself also merges the committed bound rows (that
          # is `write(merge_committed=True)`, the default), so the guard is a backstop rather
          # than the only defence — the live service holding zero bound rows is a NORMAL state
          # and must not be able to erase the record.
          #
          # LA2, 2026-08-10: this used to count `paper_track_index.csv` only — the SANDBOX
          # book. The contract-bound Valquo Index was never counted, so it could go from two
          # rows to zero without tripping anything, which is exactly what it had been doing.
          python -m valuation.edge.track_export \
            --from-json payload.json --out data_export --guard-against .guard-committed
          rm -rf .guard-committed

      - name: The bound series must be present, not merely un-regressed
        run: |
          set -euo pipefail
          # A separate check from the guard above on purpose. The guard is relative (did we
          # LOSE rows); this is absolute (is the thing we exist to protect actually here). At
          # the time LA2 was found the answer had been "no" for months while every run was
          # green, because zero is never fewer than zero.
          N=$(python -c "from valuation.edge.track_export import guard_counts as g;print(g('data_export')['bound_index_days'])")
          echo "contract-bound Valquo Index rows in the backup: $N"
          if [ "$N" -eq 0 ]; then
            echo "::error::the backup contains ZERO rows of the CONTRACT-BOUND Valquo Index (data/valquo_track.json + valquo_track_history.csv). That is the series PAPER_TRACK_CONTRACT.md binds and the one record here that cannot be re-derived. The sandbox engine's rows are NOT a substitute."
            exit 1
          fi
      - name: The data this commit changes must not redden the shared gate
        run: |
          set -euo pipefail
          pip install -q -r requirements.txt || pip install -q pandas requests
          fail=0
          for f in tests/test_paper_track.py; do
            python "$f" || { echo "::error::$f FAILED against the refreshed data"; fail=1; }
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::REFUSING to commit refreshed data that reddens the shared gate. The data is not lost -- it is still on the service and this job can be re-run. Fix the test or the register first."
            exit 1
          fi
      - name: Commit if anything changed
        run: |
          set -euo pipefail
          git config user.name  "valquo-track-backup[bot]"
          git config user.email "actions@github.com"
          git add data_export/
          # The export is deterministic, so "no diff" is the normal outcome on a quiet week
          # and must not be a failure.
          if git diff --cached --quiet; then
            echo "no change since the last backup"
            exit 0
          fi
          git commit -m "Track backup: forward paper record as of $(date -u +%Y-%m-%d)"
          git push

      - name: Say so if the backup failed
        if: failure()
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # A backup that fails quietly is not a backup. Best-effort: no webhook configured
          # still leaves a red run in the Actions tab.
          if [ -n "${HOOK:-}" ]; then
            curl -fsS -X POST "$HOOK" -H "Content-Type: application/json" \
              -d '{"content":"⚠️ Valquo **track backup FAILED**. The forward paper record is the one dataset that cannot be rebuilt — check the Actions run."}' || true
          fi

      # ---- ITEM 74: TELL DON ON DISCORD IF THIS JOB FAILED -------------------------------
      #
      # GITHUB-SIDE, AND THAT IS THE POINT RATHER THAN A CONVENIENCE. The service often cannot
      # post that the service is the thing that failed -- August's billing stoppage is the
      # recorded case -- so this runs on the runner with nothing but curl. A non-200 from the
      # service is a failure of the step that called it, so it lands here too.
      #
      # Falls back to the routine webhook with a visible prefix when the alerts one is not set
      # yet, so nothing goes quiet during setup and nobody mistakes the fallback for the
      # finished configuration. Neither value is ever echoed.
      - name: "item 74: tell Don this failed"
        if: failure()
        env:
          ALERT_HOOK: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          ROUTINE_HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -u
          HOOK="${ALERT_HOOK:-}"; PREFIX=""
          if [ -z "$HOOK" ]; then
            HOOK="${ROUTINE_HOOK:-}"; PREFIX="(alerts channel not set) "
          fi
          if [ -z "$HOOK" ]; then
            echo "::warning::neither DISCORD_ALERT_WEBHOOK_URL nor DISCORD_WEBHOOK_URL is set -- Don was NOT told this failed"
            exit 0
          fi
          RUN="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          WF=$(printf '%s' "$GITHUB_WORKFLOW" | tr -d '"\\')
          JB=$(printf '%s' "$GITHUB_JOB" | tr -d '"\\')
          # Three short lines: what broke, what it means, what to do.
          BODY=$(printf '{"content": "%s**%s / %s failed**\\nWhile this is failing that part of the Index machinery is not running.\\nOpen the run and read the failed step: %s"}' \
                 "$PREFIX" "$WF" "$JB" "$RUN")
          curl -sS -m 20 -H 'Content-Type: application/json' -d "$BODY" "$HOOK" >/dev/null \
            || echo "::warning::the Discord post itself failed"

      # ---- ITEM 74: HEALTHCHECKS END -----------------------------------------------------
      # `if: always()` and the real job status, so a failure pings /fail rather than simply not
      # pinging -- "failed" and "never ran" are different facts and the monitor must be able to
      # tell them apart.
      - name: "item 74: healthchecks end (track-backup)"
        if: always()
        env:
          HC_PING_KEY: ${{ secrets.HC_PING_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -u
          [ -n "${HC_PING_KEY:-}" ] || exit 0
          SUFFIX="/fail"
          if [ "${JOB_STATUS:-}" = "success" ]; then SUFFIX=""; fi
          curl -sS -m 10 --retry 2 "https://hc-ping.com/${HC_PING_KEY}/track-backup${SUFFIX}" \
            >/dev/null || true

